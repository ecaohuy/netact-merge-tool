name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build MergeTool.exe
        run: uv run --group build pyinstaller --onefile --windowed --name MergeTool merge_gui.py
      - name: Smoke test (import merge in the build env)
        run: uv run python -c "import merge, merge_gui; print('ok')"
      - uses: actions/upload-artifact@v4
        # artifact storage can hit the account quota; the release below still gets the exe
        continue-on-error: true
        with:
          name: MergeTool-windows
          path: dist/MergeTool.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MergeTool.exe
